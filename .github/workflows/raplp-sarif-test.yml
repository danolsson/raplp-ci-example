name: RAP-LP-SARIF-test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  raplp:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to Code Scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout RAP-LP
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: diggsweden/rest-api-profil-lint-processor
          ref: feature/719-sarif-export
          path: .raplp
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26.13.1'
      - name: Build RAP-LP
        working-directory: .raplp
        run: npm ci && npm run build
      - name: Run RAP-LP
        # Run from the repo root so SARIF uris are repository-relative
        run: node .raplp/dist/app.js -f ./specifications/sak-example.yaml --sarif sak-example.sarif --strict --minConformance 95
      - name: Upload SARIF
        # Upload even when RAP-LP fails the criteria, but skip if no report was written
        if: always() && hashFiles('sak-example.sarif') != ''
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: sak-example.sarif
          category: raplp