name: RAP-LP-JUNIT-test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  raplp:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # create check run with JUnit results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout RAP-LP
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: diggsweden/rest-api-profil-lint-processor
          ref: feature/721-junit-rapporter
          path: .raplp
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26.13.1'
      - name: Build RAP-LP
        working-directory: .raplp
        run: npm ci && npm run build
      - name: Run RAP-LP
        id: raplp
        run: node .raplp/dist/app.js -f ./specifications/sak-example.yaml --junit sak-example.junit --minConformance 80
      - name: Publish JUnit report
        if: ${{ !cancelled() && hashFiles('sak-example.junit') != '' }}
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        with:
          report_paths: sak-example.junit
          check_name: RAP-LP-junit
          include_passed: true
          detailed_summary: true
          require_tests: true
      - name: Upload JUnit artifact
        if: ${{ !cancelled() && hashFiles('sak-example.junit') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: raplp-junit
          path: sak-example.junit